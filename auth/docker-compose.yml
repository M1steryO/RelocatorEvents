services:
  auth_pg:
    image: postgres:14-alpine3.17
    env_file:
      - config/prod.env
    ports:
      - "54321:5432"
    volumes:
      - auth_postgres_volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$PG_USER\" -d \"$$PG_DATABASE_NAME\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [reloca]

  auth-server-container:
    build:
      context: ..
      dockerfile: auth/Dockerfile.local
    ports:
      - "50051:50051"
    environment:
      USERS_SERVICE_GRPC_HOST: users-server-container
      USERS_SERVICE_GRPC_PORT: "50052"
    depends_on:
      users-server-container:
        condition: service_started
    networks: [reloca]


volumes:
  auth_postgres_volume:
