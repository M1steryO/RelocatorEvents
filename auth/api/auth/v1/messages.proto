syntax = "proto3";

package github.com.M1steryO.RelocatorEvents.auth.api.v1;
option go_package = "github.com/M1steryO/RelocatorEvents/auth/pkg/api/proto/auth/v1;auth";

import "google/api/annotations.proto";


message LoginRequest{
  string email = 1;
  string password = 2;
}

message LoginResponse{
  string access_token = 1;
  string refresh_token = 2;
}

message CheckRequest{
  string access_token = 1;
  string refresh_token = 2;
  string telegram_init_data = 3;
}

message CheckResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 user_id = 3;
}

message TelegramLoginRequest{
  int64 telegram_id = 1;
}

message TelegramLoginReponse{
  string access_token = 1;
  string refresh_token = 2;
}

message GetRefreshTokenRequest{
  string old_refresh_token = 1;
}

message GetRefreshTokenResponse{
  string refresh_token = 1;
}

message GetAccessTokenRequest{
  string refresh_token = 1;
}

message GetAccessTokenResponse{
  string access_token = 1;
  string refresh_token = 2;
}




