name: Users

on:
  push:
    branches: [main, master]
    paths:
      - "users/**"
      - ".github/workflows/users.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "users/**"
      - ".github/workflows/users.yml"

env:
  REGISTRY: "cr.selcloud.ru/relocator-events"
  IMAGE_NAME: "users-server"
  CONTAINER_NAME: "users-server-container"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: users/go.sum

      - name: Build
        run: |
          cd users/
          go build -o ./bin/ -v ./...

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        run: docker login -u ${{secrets.REGISTRY_USERNAME}} -p ${{secrets.REGISTRY_PASSWORD}} $REGISTRY

      - name: Build and Push Docker Image
        run: |
          TAG_NAME=${GITHUB_SHA::7}
          docker buildx create --use
          docker buildx build --no-cache --push --tag $REGISTRY/$IMAGE_NAME:$TAG_NAME -f users/Dockerfile users/

  deploy-image:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: deploy to Selectel Cloud via SSH action
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          envs: IMAGE_NAME, REGISTRY, GITHUB_SHA, CONTAINER_NAME
          script: |
            TAG_NAME=${GITHUB_SHA::7}
            docker login -u ${{secrets.REGISTRY_USERNAME}} -p ${{secrets.REGISTRY_PASSWORD}} $REGISTRY
            docker stop $CONTAINER_NAME
            docker rm $CONTAINER_NAME
            docker run -d --name $CONTAINER_NAME --network reloca -t $REGISTRY/$IMAGE_NAME:$TAG_NAME
            docker images "$REGISTRY/$IMAGE_NAME" --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk -v keep="$REGISTRY/$IMAGE_NAME:$TAG_NAME" '$1!=keep {print $2}' \
            | xargs -r docker rmi -f || true
